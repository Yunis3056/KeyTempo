name: Build KeyTempo for Windows
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric version (for example 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build application
        run: dotnet build AutoPilotInput/AutoPilotInput.csproj -c Release
      - name: Run tests
        run: |
          $projects = Get-ChildItem -Directory -Filter '*Tests*' | Get-ChildItem -Filter '*.csproj' -Recurse
          foreach ($project in $projects) {
            [xml]$definition = Get-Content -LiteralPath $project.FullName -Raw
            $isConsoleHarness = $definition.SelectSingleNode('/Project/PropertyGroup/OutputType[text()="Exe"]')
            $isTestProject = $definition.SelectSingleNode('/Project/PropertyGroup/IsTestProject[text()="true"]')
            if ($isConsoleHarness -and -not $isTestProject) {
              dotnet run --project $project.FullName -c Release
            } else {
              dotnet test $project.FullName -c Release --verbosity normal
            }
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($project.Name)" }
          }
      - name: Locate installer compiler
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing.' }
      - name: Publish portable and installer
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } elseif ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { '1.0.0' }
          ./scripts/publish.ps1 -Version $version -RequireInstaller
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyTempo-win-x64
          path: artifacts/keytempo-release/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/keytempo-release/*
